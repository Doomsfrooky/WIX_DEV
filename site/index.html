<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RIHE 시안 목록</title>
<!-- 작업용 목록입니다(검색 제외). 시안과 페이지, 검증 도구로 가는 링크만 있습니다. 목록은 아래 LIST를 고칩니다. -->
<style>
  :root { --ink: #18202b; --mute: #667080; --line: #e2e6ec; --link: #1b3d6f; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: #fff; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 36px 0 8px; }
  p.note { color: var(--mute); margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { width: 34%; font-weight: 600; }
  a { color: var(--link); text-decoration: none; margin-right: 14px; white-space: nowrap; }
  a:hover { text-decoration: underline; }
  small { color: var(--mute); display: block; font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>RIHE 홈페이지 3차 개편</h1>
  <p class="note" id="where"></p>
  <div id="out"></div>
</main>
<script>
(function () {
  var LIST = [
    ['디자인 방향 시안 (1단계)', [
      ['_directions/a.html', 'A. 아카데믹 클래식', '남색 마스트헤드 위 세리프 제목, 남색으로 톤을 입힌 진료 영상, 대학 출판물 같은 본문'],
      ['_directions/b.html', 'B. 클리니컬 모던', '청력도 주파수 축이 그리드, 청록 커서가 지나가며 제목과 영상을 드러냄'],
      ['_directions/c.html', 'C. 에디토리얼 시네마틱', '영사기 게이트처럼 열리는 화면, 굵은 제목, 사람과 현장 영상']
    ]],
    ['페이지 (2차 디자인, 3차로 바뀔 예정)', [
      ['home.html', 'Home'], ['about.html', 'About'], ['research.html', 'Research'], ['people.html', 'People'],
      ['basic-lab.html', 'Basic Lab'], ['hearing-lab.html', 'Hearing Lab'], ['head-lab.html', 'HeAD Lab'],
      ['audiso.html', 'Audiso'], ['contact.html', 'Contact'], ['gallery.html', 'Gallery']
    ]],
    ['검증', [
      ['_probe.html', '주소 방식 실측 페이지', 'Wix HTML 요소(웹사이트 주소)에 넣어서 확인합니다.']
    ]]
  ];
  // wix-sim needs the inner page on a different origin: raw.githack.com outside, rawcdn.githack.com inside.
  var here = location.href.replace(/[?#].*$/, '').replace(/index\.html$/, '');
  var inner = here.replace('://raw.githack.com/', '://rawcdn.githack.com/');
  var sim = here.replace('://rawcdn.githack.com/', '://raw.githack.com/').replace(/site\/$/, 'tools/wix-sim.html');
  var crossOk = inner !== sim.replace(/tools\/wix-sim\.html$/, 'site/');
  document.getElementById('where').innerHTML = /githack\.com/.test(location.host)
    ? '미리보기 주소입니다. wix-sim은 바깥(raw.githack.com)과 안쪽(rawcdn.githack.com) 출처를 다르게 띄웁니다.<br>' +
      '처음 한 번만: <a href="' + inner + 'index.html" target="_blank">rawcdn 쪽 목록</a>을 열어 "Open the page"를 누르세요. 그 뒤로는 wix-sim 안 페이지가 바로 뜹니다.'
    : '로컬이면 wix-sim 링크 대신 node tools/verify/wixsim.js 를 쓰세요(바깥 localhost:8001, 안쪽 127.0.0.1:8002).';
  var html = '';
  LIST.forEach(function (g) {
    if (!g[1].length) return;
    html += '<h2>' + g[0] + '</h2><table>';
    g[1].forEach(function (it) {
      var src = inner + it[0];
      html += '<tr><td>' + it[1] + (it[2] ? '<small>' + it[2] + '</small>' : '') + '</td><td>' +
        '<a href="' + it[0] + '">페이지</a>' +
        '<a href="' + it[0] + '?lang=en">EN</a>' +
        (crossOk ? '<a href="' + sim + '?src=' + encodeURIComponent(src) + '">wix-sim</a>' +
                   '<a href="' + sim + '?w=320&src=' + encodeURIComponent(src) + '">wix-sim 320</a>' : '') +
        '</td></tr>';
    });
    html += '</table>';
  });
  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
