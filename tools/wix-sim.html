<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wix sim · RIHE</title>
<!--
  Wix HTML 요소(웹사이트 주소 방식)를 흉내 내는 검증 페이지입니다.
  - 위에 Wix 헤더(데스크톱 217px, 스크롤되면 사라짐 / 모바일 140px, sticky. 2026-11-06 실측)
  - 그 아래 고정 높이 iframe(내부 스크롤 없음). 스크롤은 이 바깥 페이지가 합니다.
  - iframe 안 페이지는 반드시 다른 출처에서 띄웁니다(같은 출처면 rootMargin이 적용되는 등 Wix와 다르게 동작).
      로컬:      http://localhost:8001/tools/wix-sim.html?src=http://127.0.0.1:8002/site/home.html
      미리보기:  https://raw.githack.com/Doomsfrooky/WIX_DEV/<해시>/tools/wix-sim.html?src=https://rawcdn.githack.com/Doomsfrooky/WIX_DEV/<해시>/site/home.html
  매개변수
      src   iframe 주소 (필수)
      w     iframe 폭. 320이면 Wix 모바일처럼 viewport width=320 + sticky 헤더 140px. 기본: 화면 폭(최소 980)
      h     iframe 높이(px). 기본 6000. docs/wix-heights.md 값을 넣습니다.
      lang  ko|en. 불러온 뒤 postMessage({lang})로 보냅니다(Wix 페이지 코드 흉내). src에 ?lang=en을 붙이는 방식과 별개입니다.
      hh    헤더 높이(px) 덮어쓰기
      hud   0이면 오른쪽 아래 정보 상자를 숨깁니다.
-->
<style>
  :root { --hh: 217px; --line: #d8dde4; --ink: #1d2430; --mute: #6b7482; --bg: #f3f4f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.wix { height: var(--hh); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 32px 22px; position: relative; z-index: 50; }
  header.wix .brand { font-weight: 600; letter-spacing: .02em; }
  header.wix nav { display: flex; gap: 18px; color: var(--mute); flex-wrap: wrap; }
  body.m header.wix { position: sticky; top: 0; padding: 0 14px 14px; }
  body.m header.wix nav { display: none; }
  .strip { background: #fff; display: flex; justify-content: center; }
  iframe { display: block; border: 0; width: 100%; background: #fff; }
  footer.wix { height: 320px; background: #fff; border-top: 1px solid var(--line); margin-top: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); }
  .hud { position: fixed; right: 10px; bottom: 10px; z-index: 99; background: rgba(20, 24, 32, .86); color: #e9edf3; border-radius: 6px; padding: 8px 10px; font: 11px/1.45 ui-monospace, Menlo, monospace; min-width: 170px; }
  .hud b { color: #fff; font-weight: 600; }
  .hud button { font: inherit; margin: 4px 4px 0 0; padding: 2px 7px; border-radius: 3px; border: 1px solid #556; background: #2a3140; color: #fff; cursor: pointer; }
  .hud button[aria-pressed="true"] { background: #4b6fae; border-color: #4b6fae; }
  .hud.hide { display: none; }
  .empty { padding: 60px 24px; text-align: center; color: var(--mute); }
</style>
</head>
<body>
<header class="wix"><span class="brand">smilesnail.org (Wix 헤더 자리)</span><nav><span>Home</span><span>About</span><span>Research</span><span>People</span><span>Labs</span><span>Gallery</span><span>Contact</span></nav></header>
<div class="strip"><div id="slot" style="width:100%"></div></div>
<footer class="wix">Wix 푸터 자리</footer>
<div class="hud" id="hud"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('src') || '';
  var w = parseInt(q.get('w') || '0', 10);
  var h = parseInt(q.get('h') || '6000', 10);
  var lang = q.get('lang');
  var mobile = w === 320;
  var body = document.body;
  if (mobile) {
    body.classList.add('m');
    document.getElementById('vp').setAttribute('content', 'width=320, user-scalable=yes');
    document.documentElement.style.setProperty('--hh', '140px');
  }
  if (q.get('hh')) document.documentElement.style.setProperty('--hh', parseInt(q.get('hh'), 10) + 'px');
  var slot = document.getElementById('slot');
  if (w) slot.style.width = w + 'px';
  if (!src) {
    slot.innerHTML = '<p class="empty">?src= 에 띄울 페이지 주소를 넣으세요. 안쪽 페이지는 바깥과 다른 출처여야 합니다.</p>';
  } else {
    var f = document.createElement('iframe');
    f.src = src; f.title = 'Embedded Content'; f.scrolling = 'no'; f.height = h; f.style.height = h + 'px';
    f.setAttribute('allow', 'fullscreen');
    slot.appendChild(f);
    window.SIM = { iframe: f, setHeight: function (px) { f.height = px; f.style.height = px + 'px'; } };
    f.addEventListener('load', function () { if (lang) send(lang); });
  }
  function send(l) { var f = slot.querySelector('iframe'); if (f) f.contentWindow.postMessage({ lang: l }, '*'); cur = l; draw(); }
  var cur = lang || 'ko';
  var sameOrigin = false;
  try { sameOrigin = src && new URL(src, location.href).origin === location.origin; } catch (e) {}
  var hud = document.getElementById('hud');
  if (q.get('hud') === '0') hud.classList.add('hide');
  function draw() {
    var f = slot.querySelector('iframe');
    var top = f ? Math.round(f.getBoundingClientRect().top) : 0;
    hud.innerHTML = '<b>wix-sim</b> ' + (mobile ? '320 mobile' : (w || innerWidth) + ' desktop') +
      '<br>outer scrollY ' + Math.round(scrollY) + ' · iframe top ' + top +
      '<br>iframe ' + (f ? f.offsetWidth + '×' + f.offsetHeight : '-') + ' · viewport ' + innerWidth + '×' + innerHeight +
      (sameOrigin ? '<br><b style="color:#ffb4a8">같은 출처! 검증이 거짓으로 통과할 수 있음</b>' : '<br>cross-origin ✓') +
      '<br><button data-l="ko" aria-pressed="' + (cur === 'ko') + '">KO</button><button data-l="en" aria-pressed="' + (cur === 'en') + '">EN</button>';
  }
  hud.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) send(b.getAttribute('data-l')); });
  addEventListener('scroll', draw, { passive: true }); addEventListener('resize', draw);
  // Wix page code에서 iframe이 보내는 메시지를 받는 것처럼 콘솔에 기록
  addEventListener('message', function (e) { if (e.source !== window) console.log('[wix-sim] message from iframe', e.origin, e.data); });
  draw();
})();
</script>
</body>
</html>
